<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Net Ward social card</title>
  <link rel="stylesheet" href="social-card.css">
</head>
<body>
  <main>
    <section class="copy">
      <div class="brand"><span>NW</span> Net Ward</div>
      <p class="eyebrow">LOCAL HTTP DECEPTION · V0.4.7</p>
      <h1>Make bad traffic<br><strong>take the long way.</strong></h1>
      <p class="subhead">User-space · Fail-open · No retaliation</p>
    </section>
    <section class="map" aria-label="Synthetic Net Ward route map">
      <div class="source">HTTP<br><small>incoming</small></div>
      <span class="line line-in"></span>
      <div class="ward">NW<br><small>classify</small></div>
      <span class="line line-good"></span>
      <span class="line line-bad"></span>
      <div class="target upstream"><b>200</b><br>upstream<small>clean request</small></div>
      <div class="target mirror"><b>↺</b><br>mirror<small>known probe</small></div>
      <div class="label good-label">PASS</div>
      <div class="label bad-label">DEFLECT</div>
    </section>
  </main>
</body>
</html>
