name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) when a GitHub Release is
# published. No API token is stored anywhere: PyPI verifies the workflow's
# short-lived OIDC identity instead. Configure the trusted publisher once at
# https://pypi.org/manage/project/<name>/settings/publishing/
#
# Tests and the full distribution scan must pass before publication.

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    # Do not attach the pypi environment here. That environment is for
    # build/publish; its secrets are invisible to this job. The private-term
    # list must be a repository secret so this job can read it.
    runs-on: ubuntu-latest
    env:
      # Fork PRs do not receive secrets. Same-repo PRs and releases must
      # have the list; a skip must not go green.
      PUSH_GUARD_REQUIRE_TERMS: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fail if the blocked-term list is required and missing
        if: env.PUSH_GUARD_REQUIRE_TERMS == 'true'
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: |
          python - <<'PY'
          import os
          import sys

          raw = os.environ.get("PUSH_GUARD_BLOCKED_TERMS", "")
          has_terms = any(
              line.strip() and not line.strip().startswith("#")
              for line in raw.splitlines()
          )
          if not has_terms:
              sys.stderr.write(
                  "PUSH_GUARD_BLOCKED_TERMS is missing or has no usable terms. "
                  "Add it as a repository Actions secret so jobs without the "
                  "pypi environment can read it.\n"
              )
              raise SystemExit(1)
          print("blocked-term list is present")
          PY
      - name: Install package with dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Buyer-hygiene gate (blocks publish on cross-product leaks)
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: python -m pytest tests/test_buyer_hygiene.py -v
      - name: Full test suite
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: python -m pytest -q

  build:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = f"v{metadata['project']['version']}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit("release tag does not match package version")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1 push-guard==0.4.3
          python -m build
      - name: Scan complete distributions
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: push-guard scan-package --repo . --require-explicit-terms --min-terms 3 dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [test, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
