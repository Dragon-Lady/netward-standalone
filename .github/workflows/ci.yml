name: CI

# Runs the full test suite — including the buyer-hygiene gate that blocks
# cross-product leaks (e.g. sister-product references in public source) — on
# every push and pull request. This is the fast-feedback layer; the publish
# workflow runs the same gate again as a hard precondition for releasing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fork PRs do not receive secrets. Same-repo PRs and pushes must
      # have the list; a skip must not go green.
      PUSH_GUARD_REQUIRE_TERMS: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fail if the blocked-term list is required and missing
        if: env.PUSH_GUARD_REQUIRE_TERMS == 'true'
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: |
          python - <<'PY'
          import os
          import sys

          raw = os.environ.get("PUSH_GUARD_BLOCKED_TERMS", "")
          has_terms = any(
              line.strip() and not line.strip().startswith("#")
              for line in raw.splitlines()
          )
          if not has_terms:
              sys.stderr.write(
                  "PUSH_GUARD_BLOCKED_TERMS is missing or has no usable terms. "
                  "Add it as a repository Actions secret so jobs without the "
                  "pypi environment can read it.\n"
              )
              raise SystemExit(1)
          print("blocked-term list is present")
          PY
      - name: Install package with dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Buyer-hygiene gate (no cross-product leaks)
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: python -m pytest tests/test_buyer_hygiene.py -v
      - name: Full test suite
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: python -m pytest -q
